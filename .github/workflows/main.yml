name: Suno Worker

on:
  workflow_dispatch:

  # Start a fresh worker every 5 hours.
  # This is the backup/restart mechanism.
  schedule:
    - cron: "0 */5 * * *"

# Minimum permissions possible.
permissions:
  contents: read

concurrency:
  group: suno-worker
  cancel-in-progress: false

jobs:
  run-worker:
    name: Run Suno Worker
    runs-on: ubuntu-latest

    # Leave some safety margin below GitHub's 6-hour job limit.
    timeout-minutes: 345

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # --------------------------------------------------
      # 3. System dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget

      # --------------------------------------------------
      # 4. Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python patch_hcaptcha.py

          playwright install chromium

      # --------------------------------------------------
      # 5. Create runtime environment
      #
      # NOTHING SECRET IS STORED IN THE REPOSITORY.
      # --------------------------------------------------
      - name: Create environment
        env:
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          cat > .env <<EOF
          SUNO_API_KEY=${SUNO_API_KEY}
          DASH_PASSWORD=${DASH_PASSWORD}
          SECRET_KEY=${SECRET_KEY}

          PORT=3000
          PYTHONUNBUFFERED=1
          SUNO_DATA_DIR=${{ github.workspace }}/data

          GEMINI_API_KEY=${GEMINI_API_KEY}

          R2_ENDPOINT=${R2_ENDPOINT}
          R2_ACCESS_KEY=${R2_ACCESS_KEY}
          R2_SECRET_KEY=${R2_SECRET_KEY}
          R2_BUCKET=${R2_BUCKET}
          R2_PREFIX=suno-worker/data/
          R2_ENABLED_FOR_WRITE=true

          COOKIE_SECURE=false
          EOF

          chmod 600 .env

      # --------------------------------------------------
      # 6. Start worker
      # --------------------------------------------------
      - name: Start worker
        env:
          DISPLAY: ":99"
        run: |
          mkdir -p data

          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid

          python server.py > /tmp/suno-worker.log 2>&1 &
          echo $! > /tmp/worker.pid

          sleep 5

          if ! kill -0 "$(cat /tmp/worker.pid)" 2>/dev/null; then
            echo "Worker failed to start."
            cat /tmp/suno-worker.log
            exit 1
          fi

          echo "Worker started successfully."

      # --------------------------------------------------
      # 7. Install Cloudflare Tunnel
      # --------------------------------------------------
      - name: Install cloudflared
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

      # --------------------------------------------------
      # 8. Run tunnel
      # --------------------------------------------------
      - name: Run worker + tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "Starting Cloudflare Tunnel..."

          timeout 330m \
            cloudflared tunnel \
            --no-autoupdate \
            run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            || true

      # --------------------------------------------------
      # 9. Diagnostics
      # --------------------------------------------------
      - name: Show worker log
        if: always()
        run: |
          echo "===== WORKER LOG ====="

          if [ -f /tmp/suno-worker.log ]; then
            tail -n 500 /tmp/suno-worker.log
          fi

      # --------------------------------------------------
      # 10. Upload non-sensitive debug files
      # --------------------------------------------------
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: data/**/*.png
          if-no-files-found: ignore
          retention-days: 1

      # --------------------------------------------------
      # 11. Cleanup
      # --------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/worker.pid ]; then
            kill "$(cat /tmp/worker.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi

          rm -f .env
